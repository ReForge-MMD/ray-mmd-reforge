// Sun Light
// 0 : Disabled
// 1 : Simple Directional Light
// 2 : Physical Atmosphere (Zenith-calculated solar irradiance)
#define SUN_LIGHT_ENABLE 2

// Physical Area Sun Disk Specular
// Replaces infinitesimal point-light specular with a realistic 0.53° angular diameter solar disk.
// Eliminates specular subpixel shimmering/crawling on smooth materials (water, glass, metal, eyes).
// 0 : Point light specular
// 1 : Physical Sun Disk BRDF (SphereMaxNoH representative point integration)
#define SUN_SPECULAR_DISK_ENABLE 1

// Solar Translucency / Forward-Scattering Backlight
// Simulates direct sunlight transmission through thin objects (foliage, leaves, cloth, ears).
// 0 : Disabled
// 1 : Enabled (Henyey-Greenstein forward phase scattering)
#define SUN_BACKLIGHT_TRANSLUCENCY 1

// Sun Cascaded Shadow Map Quality
// 0 : Disabled
// 1 : Low       (1024x1024)
// 2 : Medium    (2048x2048)
// 3 : High      (4096x4096)
// 4 : Cinematic (8192x8192)
#define SUN_SHADOW_QUALITY 4

// Percentage-Closer Soft Shadows (PCSS) for Sun Light
// Physically based contact-hardening soft shadows with blocker search & penumbra estimation.
// 0 : Uniform Soft Shadows (High-Quality Poisson PCF)
// 1 : Contact-Hardening PCSS (Sharp contact, physically expanding penumbra)
#define SUN_SHADOW_PCSS 1

// Physical Angular Sun Diameter (determines penumbra softness in PCSS)
// 0.005 : Sharp direct sun
// 0.015 : Natural earth sun (~0.53° angular diameter)
// 0.030 : Soft overcast / hazy sun
#define SUN_LIGHT_RADIUS 0.015f

// Edge-preserving cross-bilateral filter for soft penumbra denoising
// 0 : Disabled
// 1 : Enabled
#define SUN_SHADOW_BLUR 1

// Contact Shadows (Screen-Space Contact Shadows)
// 0 : Disabled
// 1 : Low    ( 8 steps)
// 2 : Medium (12 steps)
// 3 : High   (16 steps)
#define CONTACT_SHADOW_QUALITY 3

// Screen-Space Global Shadows (SSGS)
// Long-range screen-space ray tracing toward the directional (sun) light.
// Casts soft penumbra shadows between nearby objects without a shadow map.
// Works independently of CONTACT_SHADOW_QUALITY.
// 0 : Disabled
// 1 : Low    (16 steps, ~3m range)
// 2 : Medium (24 steps, ~8m range)
// 3 : High   (32 steps, ~15m range)
#define SSGS_QUALITY 3

// Image Based Lighting (IBL)
// 0 : Disabled
// 1 : Enabled
// 2 : Enabled + Flip UV Y
#define IBL_QUALITY 1

// Volumetric / Sky Fog
// 0 : Disabled
// 1 : Enabled
#define FOG_ENABLE 1

// Local Lights (Point, Spot, Rectangle, Disk, Tube Lights)
// 0 : Disabled
// 1 : Enabled
#define MULTI_LIGHT_ENABLE 1

// Outlines / Edge Lines
// 0 : Disabled
// 1 : Standard
// 2 : Edge-Detection + SMAA
// 3 : Edge-Detection + SSAA
#define OUTLINE_QUALITY 0

// Diffuse BRDF Model
// 0 : Disney / Burley (Empirical diffuse retroreflection)
// 1 : EON (Energy-preserving Oren-Nayar, Portsmouth et al. JCGT 2025)
#define DIFFUSE_BRDF_TYPE 1

// Specular highlight softening / geometric anti-aliasing (SphereMaxNoH,
// de Carpentier 2017, "Decima Engine: Advances in Lighting and AA").
// Treats point-ish lights as a sphere of angular radius asin(SinAlpha) and picks
// the largest NoH over its solid angle, killing the tiny shimmery highlights on
// smooth materials. No-op at 0.
// 0    : Disabled (exact analytic half-vector)
// 0.05 : Subtle AA of highlight edges (recommended for screenshots)
// 0.1  : Definite sphere-light softening
// 0.2+ : Very soft, bloated highlights (stylization)
#define SPEC_LIGHT_SIN_ALPHA 0

// Fresnel kernel for GGX speculars
// 0 : Schlick (classic, default)
// 1 : Adobe F82 (Kutz et al. 2021) - preserves hue variation of colored
//     speculars (metals, coated fabrics, iridescent films) at mid angles,
//     where pure Schlick washes out to lerp(F0, F90)
// NOTE: both values must be identical (int compile-time constant)
#define BRDF_FRESNEL_TYPE 1

// Cloth sheen visibility model (Cloth / microfiber materials)
// 0 : Fast Approximation (Neubelt / Pettineo)
// 1 : Full Analytical Fit (Estevez & Kulla 2017)
#define BRDF_CLOTH_VIS_CHARLIE 1

// Toon-shading material
// 0 : Disabled
// 1 : Cel Shading
// 2 : Cel Shading + Diffusion Blur
#define TOON_ENABLE 0

// ----------------------------- Skin / SSS -----------------------------
// All defaults reproduce the legacy ray-mmd skin look; each knob is opt-in.
// SSS shading runs the UE5-style artist toolchain only (customDataA opacity,
// AO BackScatter, view-dependent InScatter, Beer-Lambert transmission with
// HSV hue shift) - see Shader/BRDF.fxsub. The pre-integrated Jimenez LUT +
// Penner path is gone.

// Backlit forward-scattering glow through thin skin features (ears, fingers,
// nostrils). Henyey-Greenstein phase evaluated at the refraction-corrected V.
// 0 : Disabled (default)
// ~1: Subtle backlit hairline glow through the ear tips
// ~3: Full rim "electric" backlight
// Tune the glow width with SKIN_BACKLIT_G. IOR ~1.4 for skin.
#define SKIN_BACKLIT_STRENGTH 0
#define SKIN_BACKLIT_G 0.76
#define SKIN_BACKLIT_IOR 1.4

// Dual-lobe skin specular as authorable profile data (two-GGX skin profile,
// per Jimenez 2015 separable-SSS dual-specular lobes).
// Lobe 0 = broad dermal layer, Lobe 1 = tight epidermal/sebum layer.
// Defaults = old hardcoded behavior (r0 = r*1.15+0.05, r1 = r*0.35+0.02, 70/30)
#define SKIN_SPEC_LOBE0_SCALE 1.15
#define SKIN_SPEC_LOBE0_ADD   0.05
#define SKIN_SPEC_LOBE1_SCALE 0.35
#define SKIN_SPEC_LOBE1_ADD   0.02
#define SKIN_SPEC_LOBE0_MIX   0.70
#define SKIN_SPEC_LOBE1_MIX   0.30

// Global SSS mean-free-path multiplier: how deeply light penetrates skin.
// 1.0 = authored response as-is; >1 wraps the SSS/glow deeper (chubby children,
// softer faces); <1 tightens it (detailed sculpts, hard-terminator anime skin)
#define SKIN_SSS_MFP_SCALE 1.0

// Toon look grading - applies to CEL / TONEBASED materials only.
// Ported from HAToon2/PAToon2, M4Toon2, Jashin Toon and T_ToonShader.
// Shadow color grade, applied on top of the material's own shadow color (customB):
#define TOON_SHADOW_MUL         float3(1.0, 1.0, 1.0) // multiply the shadow color
#define TOON_SHADOW_ADD         float3(0.0, 0.0, 0.0) // then add
#define TOON_SHADOW_HUE         0    // rotate shadow hue, degrees (-180 .. 180)
#define TOON_SHADOW_WARMTH      0    // 0..1 luminance-preserving warm push (anime skin shadows)
// Auto-tint shadows over low-saturation albedo (white clothes, skin) so they
// don't read as gray dirt. Tint strength scales with (1 - saturation).
#define TOON_AUTOTINT_COLOR     float3(0.95, 0.80, 1.05) // 0 = off; soft pink-lavender anime tint
#define TOON_AUTOTINT_THRESHOLD 0.03                  // max base saturation still treated as colorless
#define TOON_AUTOTINT_STRENGTH  1.0                   // 0..1
// Fallback when a material defines no shadow color (customB = 0): derive it
// from the albedo as pow(albedo, TOON_SELF_POWER_SHADOW). 0 = old behavior.
#define TOON_SELF_POWER_SHADOW  0    // try ~0.98 (Jashin Toon SelfPowerShadowStrength)
// Rim light folded into the terminator before banding, so it inherits the cel bands
#define TOON_RIM_STRENGTH       0 // 0 = off; ~0.15-0.4 to taste
#define TOON_RIM_POWER          2.5  // silhouette falloff sharpness

// Method for Ambient Occlusion
// 0 : Legacy SSDO (Original Ray-MMD directional occlusion)
// 1 : HBSSDO      (Horizon-Based Screen-Space Directional Occlusion, Reforge Edition)
// 2 : GTAO        (Ground-Truth Ambient Occlusion + GTSO, Jimenez / Activision)
#define SSAO_TYPE 2

// Screen Space Directional Occlusion Samples
// 0 : Disabled
// 1 : Very Low  ( 8 samples)
// 2 : Low       (12 samples)
// 3 : Medium    (16 samples)
// 4 : High      (20 samples) // https://www.slideshare.net/ozlael/mssao-presentation
// 5 : Ultra     (24 samples)
// 6 : Extreme   (28 samples)
#define SSDO_QUALITY 6

// Top-Down Sky Visibility / Heightfield Ambient Occlusion (Snowdrop Engine / GDC 2016)
// Captures long-range macro ambient occlusion from large overhead structures (bridges, roofs, canopies, tunnels)
// preventing outdoor skylight / ambient IBL from leaking into covered spaces.
// 0 : Disabled
// 1 : Fast      (4-direction horizon search)
// 2 : Cinematic (8-direction cone-tracing)
#define SKY_VISIBILITY_ENABLE 2

// Screen Space Reflection (SSRT ray-marching with SIMD batching)
// High-performance screen-space ray tracing using vectorized linear SIMD marching.
// Uses SIMD 4-sample texture batching, dynamic slope-based tolerance, and sub-texel precision.
// The value controls the ray sample budget:
// 0 : Disabled
// 1 : Low    (128 steps, 32 SIMD batches)
// 2 : Medium (256 steps, 64 SIMD batches)
// 3 : High   (384 steps, 96 SIMD batches)
// 4 : Ultra  (512 steps, 128 SIMD batches, cinematic fidelity)
#define SSR_QUALITY 4

// SSR debug overlay: diagnostic visualization of the SSR pass.
// Requires SSRDebugController.pmx loaded in the scene.
// 0 : Disabled (normal rendering)
// 1 : Enabled  (compile the debug modes in)
#define SSR_DEBUG 0

// Screen-Space Refraction for glass & water materials (SHADINGMODELID_GLASS).
// Traces the refracted ray using Newton's root-finding method (Mayer et al. 2026)
// to find the true 3D background intersection instead of a flat screen offset.
// 0 : Fast Screen-Offset
// 1 : Physically Based (Newton's Method 3D Root-Finding)
#define GLASS_REFRACTION 1

// Screen-Space Directional Water Caustics
// Calculates real-time focused underwater light bands on submerged surfaces by
// back-projecting scene points along SunDirection to the water plane and computing
// analytical wave curvature (Jacobian flux concentration) with chromatic dispersion.
// 0 : Disabled
// 1 : Enabled
#define WATER_CAUSTICS_ENABLE 1

// Default water surface level in world space (Y coordinate).
// Can be dynamically adjusted via CausticsController.pmx (WaterHeight+ / WaterHeight-).
#define WATER_CAUSTICS_SURFACE_Y 0.0f

// Default base caustics intensity.
// Can be fine-tuned via CausticsController.pmx (Intensity+ / Intensity-).
#define WATER_CAUSTICS_INTENSITY 1.5f

// Global Illumination (Screen-Space Raytraced GI)
// 0 : Disabled
// 1 : Accent    (Clean, focused local contact bounces & emissive glow)
// 2 : SSGI      (UE5-style Multi-Bounce Global Illumination & ambient room radiance)
// 3 : RTGI/SSPT (qUINT-style Screen-Space Path Tracing & multi-bounce irradiance)
#define GI_ENABLE 3

// GI Quality (Unified ray count and step presets for both SSGI and SSPT)
// 1 : Low       (Ray Steps: 12; Ray Count: 4)  - Fast preview, minimum performance cost
// 2 : Medium    (Ray Steps: 12; Ray Count: 8)  - Balanced real-time viewport performance
// 3 : High      (Ray Steps: 14; Ray Count: 12) - Rich indirect bounce for complex scenes
// 4 : Cinematic (Ray Steps: 16; Ray Count: 16) - Maximum fidelity for high-resolution renders
#define GI_QUALITY 1

// SSPT / RTGI Specific Parameters (Active when GI_ENABLE == 3)
// Maximum path-tracing ray search distance in world space units
#define SSPT_SAMPLE_RADIUS 16.0f

// Geometry Z-thickness threshold: eliminates light leaking through thin walls, hair, fingers
#define SSPT_Z_THICKNESS 1.0f

// Indirect lighting bounce intensity multiplier
#define SSPT_IL_AMOUNT 2.0f

// Ambient occlusion intensity power curve
#define SSPT_AO_AMOUNT 1.0f

// Multi-bounce indirect reflection feedback (0: off, 1: on)
#define SSPT_BOUNCES 1

// Weight of secondary bounce feedback
#define SSPT_BOUNCE_WEIGHT 0.35f

// Sensitivity of the À-Trous cross-bilateral wavelet edge-preserving denoiser
#define SSPT_FILTER_SENSITIVITY 1.0f

// Specular GI: reuses the denoised GI radiance as a local indirect specular term (Fresnel-weighted).
// Fills colored indirect reflections on rough surfaces where mirror SSR misses and the IBL cubemap is too blurry.
// 0 : Disabled
// 1 : Enabled
#define SSGI_SPECULAR_GI 1

// Screen Space Subsurface Scattering
// 0 : Disabled
// 1 : Enabled
#define SSSS_QUALITY 1

// Texture-space SSS diffusion for opaque skin (SSSS_QUALITY required).
// The sun diffuse base of skin is rendered once per skin material in the
// model's UV (texture) space into shared targets, convolved with the same
// Christensen-Burley profile with WRAP addressing, and the deferred composite
// consumes it at the G-buffer packed UV instead of the per-pixel NdotL base.
// Kernel radius stays constant in texture space, so scatter no longer varies
// with camera distance and cannot bleed across screen silhouettes.
// Materials that lack a valid UV island this frame (alpha/parallax/emissive
// pieces, colliding multi-model islands) fall back to the screen-space SSSS.
// NOTE: keep SSSS_TEXSPACE in sync with the same define at the top of
// Materials/material_common_2.0.fxsub (the material stage cannot see ray.conf).
// 0 : Screen-Space Separable SSSS (Baseline)
// 1 : Texture-Space UV Diffusion  (Opaque Skin)
#define SSSS_TEXSPACE 1

// Bokeh Depth Of Field
// https://docs.unrealengine.com/4.27/en-US/RenderingAndGraphics/PostProcessEffects/DepthOfField/
// MeasureMode (0.00 ~ 0.24) : Test circle 
// MeasureMode (0.25 ~ 0.49) : Test circle + Bone from ray.x
// MeasureMode (0.50 ~ 0.98) : FocalDistance Only
// MeasureMode (0.99 ~ 1.00) : FocalDistance + Bone from ray.x
// 0 : Disabled
// 1 : Cinematic Circular Bokeh (CryEngine 3 Graphics Gems [Sousa13])
// 2 : Hexagonal Aperture Bokeh (Hexagonal Bokeh Blur Revisited [Barre-Brisebois17])
#define BOKEH_MODE 2

// Eye Adaptation
// https://docs.unrealengine.com/latest/INT/Engine/Rendering/PostProcessEffects/AutomaticExposure/index.html
// 0 : Disabled
// 1 : ISO 100 (Middle Gray at 12.7% - http://en.wikipedia.org/wiki/Film_speed)
// 2 : ISO 100 (Middle Gray at 18.0% - Standard Photo Metering)
#define HDR_EYE_ADAPTATION 2

// Bloom
// see this paper for 1st~5th HSV
// http://kalogirou.net/2006/05/20/how-to-do-good-bloom-for-hdr-rendering/
// 0 : Disabled
// 1 : Unclamped / Infinite (Legacy 1.1)
// 2 : Saturated            (Legacy 1.1)
// 3 : Luminance & Exposure (Legacy 1.2)
// 4 : Saturated & Exposure (Modern 1.3+)
#define HDR_BLOOM_MODE 4

// Spectral / Chromatic Dispersion Bloom
// Adds physical chromatic wavelength separation across bloom layers (simulating optical lens dispersion)
// 0 : Disabled
// 1 : Subtle Cinematic Fringe
// 2 : Anamorphic Spectral Fringe
// 3 : Strong Sci-Fi Prism Bloom
#define HDR_BLOOM_SPECTRAL_MODE 1

// Filmic Halation (Film Emulsion Red-Orange Highlight Bleed)
// Simulates back-scattering of red wavelengths from film base (CineStill 800T / Kodak Vision3)
// 0 : Disabled
// 1 : Subtle 35mm Cine Halation    (Warm Kodak Vision3 emulsion glow)
// 2 : CineStill 800T Rich Halation (Iconic red-orange halo around bright practical lights)
// 3 : Heavy Vintage Neon Halation  (Intense stylized glow for music videos)
#define FILMIC_HALATION_MODE 2

// Simple Lens Flare
// 0 : Disabled
// 1 : Blue
// 2 : Orange
// 3 : Auto Color
#define HDR_FLARE_MODE 0

// Glare Star / Anamorphic Streak
// 0 : Disabled
// 1 : Anamorphic Flare (Blue)
// 2 : Anamorphic Flare (Auto Color)
// 3 : Glare Star (Orange)
// 4 : Glare Star (Auto Color)
#define HDR_STAR_MODE 1

// Tonemapping Operators
// https://docs.unrealengine.com/latest/INT/Engine/Rendering/PostProcessEffects/ColorGrading/index.html
// 0 : Linear       (None / Unmapped)
// 1 : Reinhard     (Luminance-preserving Reinhard)
// 2 : Hable        (Uncharted 2 Filmic Curve, White Point = 4)
// 3 : Uncharted2   (Extended Range Filmic Curve, White Point = 8)
// 4 : Hejl 2015    (Modern Film Curve without toe desaturation)
// 5 : ACES-sRGB    (Standard ACES fit by Krzysztof Narkowicz)
// 6 : Naughty Dog  (Cinematic Tone Curve)
// 7 : ACES-Fitted  (Stephen Hill exact ACES RRT/ODT fit without hue shifting)
// 8 : AgX          (Blender 4.0 standard filmic curve by Troy Sobotka - pure highlights)
#define HDR_TONEMAP_OPERATOR 8

// Depth of Field Cat`s Eye Bokeh (Optical Mechanical Vignetting)
// Squeezes out-of-focus bokeh highlights into oval cat-eye shapes toward image edges (anamorphic cine look)
// 0 : Disabled (Uniform circular/hexagonal bokeh)
// 1 : Enabled  (Default cine lens optical distortion)
#define DOF_BOKEH_CATS_EYE 1

// Anti-Aliasing (AA)
// 0 : Disabled
// 1 : FXAA HQ      (Nvidia FXAA 3.11 12-sample with 0.75 subpixel filter, fastest)
// 2 : SMAA Medium  (Color Edge Detection, 16 search steps, dual-axis blend)
// 3 : SMAA High    (Color Edge Detection, 24 search steps, dual-axis blend, 0.35 subpixel filter)
// 4 : SMAA Ultra   (True Jimenez 1x Ultra, 32 search steps, dual-axis blend, 0.50 subpixel reconstruction)
// 5 : SMAA Ultra+  (Depth-predicated G-Buffer silhouettes + 32 search steps + dual-axis + 0.65 subpixel reconstruction)
// 6 : TAA          (Temporal AA with Catmull-Rom history filter, best for static/smooth animations)
// 7 : G-DLAA       (Hybrid Geometric & Directional AA, preserves fine texture details)
#define AA_QUALITY 5

// Motion Blur (Screen-Space Velocity Blur)
// USE ONLY FOR ANIMATIONS!!
// 0 : Disabled
// 1 : Camera Velocity Only     (Works with any AA mode, high performance)
// 2 : Camera + Object Velocity (Full hybrid motion blur with animated mesh VelocityMap)
#define POST_MOTION_BLUR_ENABLE 0

// Postprocess Dispersion (Chromatic Aberration)
// 0 : Disabled
// 1 : Color Shift
// 2 : Multi-Spectral Chromatic Aberration
// 3 : Cinematic Barrel Lens Dispersion (Quadratic radial chromatic distortion)
#define POST_DISPERSION_MODE 3

// Contrast Adaptive Sharpening (AMD FidelityFX CAS)
// 0 : Disabled
// 1 : Enabled
#define POST_SHARPEN_ENABLE 1

// CAS Sharpening Intensity (0.0 = minimal, 0.5 = balanced default, 1.0 = maximum sharp)
#define POST_SHARPEN_INTENSITY 0.5

// Cinematic Film Grain (Applied after sharpening to hide banding)
// 0 : Disabled
// 1 : Enabled
#define FILM_GRAIN_ENABLE 0

// Film Grain Intensity (0.0 = minimal, 0.05 = subtle, 0.15 = cinematic)
#define FILM_GRAIN_INTENSITY 0.05
